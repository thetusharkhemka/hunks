version: 2

# Updates wait a week after a release before they are proposed. Worms such
# as Shai-Hulud spread through versions that were live for hours; a
# cooldown lets the registry pull those before they reach this repository.
# Security updates are not delayed.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @types/node stays on Node 22, the oldest Node the tests run on, so
      # that the type checker flags APIs which Node 22 does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
