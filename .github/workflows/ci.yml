name: CI

on:
  push:
    branches: [main]
  pull_request:

# No token permissions unless a job asks for them. Actions are pinned to
# full commit SHAs: a tag can be moved to other code, a commit cannot.
permissions: {}

jobs:
  test:
    name: Node ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check the registry signatures of the dev dependencies
        run: npm audit signatures
      - name: git used as the reference
        run: git --version
      - run: npm run typecheck
      - run: npm test
      - name: Differential fuzzing against git
        run: node test/fuzz.ts 5000 ${{ github.run_number }}
      - name: Differential fuzzing of merges against git
        run: node test/merge-fuzz.ts 2000 ${{ github.run_number }}
      - run: npm run build

  windows:
    name: Library tests, windows-latest
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --test test/api.test.ts test/security.test.ts test/merge.test.ts

  oldest-node:
    name: Built package on Node 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - run: node test/smoke.mjs
