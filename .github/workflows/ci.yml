name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: git used as the reference
        run: git --version
      - run: npm run typecheck
      - run: npm test
      - name: Differential fuzzing against git
        run: node test/fuzz.ts 5000 ${{ github.run_number }}
      - run: npm run build

  windows:
    name: API tests, windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test test/api.test.ts

  oldest-node:
    name: Built package on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node test/smoke.mjs
