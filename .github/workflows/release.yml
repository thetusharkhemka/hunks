name: Release

# Stages a release on npm when a version tag is pushed, through npm trusted
# publishing. npm checks this workflow's OpenID Connect identity instead of
# a token, so there is no token to steal, and every release carries a
# provenance attestation that ties the tarball to this repository, commit
# and run. A staged release stays private until a maintainer approves it
# on npm with two-factor authentication. Setup: RELEASING.md.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Give this environment required reviewers, and name it in the trusted
    # publisher settings on npmjs.com, so that a release needs a person.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A release is built from nothing but the commit and the lockfile.
          package-manager-cache: false
      - name: The tag names the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm new enough for staged publishing (11.15.0)
        run: node -e "const [a,b]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm --version)"
      - run: npm ci --ignore-scripts
      - name: Check the registry signatures of the dev dependencies
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The checks above already ran, so prepublishOnly is skipped here.
      # Staging asks for no second factor; approving it does.
      - run: npm stage publish --provenance --access public --ignore-scripts
